<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a638f"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="74" fill="#12213f"/>
  <text x="48" y="32" font-size="22" font-weight="700" fill="#ffffff">Kurukshetra — Risk Pipeline &amp; Decision Flow</text>
  <text x="48" y="54" font-size="13" fill="#aebbd6">Two intervention moments, escalating checks, one deterministic score</text>
  <text x="1232" y="43" font-size="12" fill="#7f8fae" text-anchor="end">Every stage is rule-based — no model inference</text>

  <!-- ===== Two moments row ===== -->
  <text x="48" y="106" font-size="12" font-weight="700" fill="#3d3d3d" letter-spacing="0.5">THE TWO MOMENTS OF INTERVENTION</text>

  <g filter="url(#sh)">
    <rect x="48" y="118" width="330" height="72" rx="10" fill="#eef2fb" stroke="#c3cfe6" stroke-width="1.5"/>
  </g>
  <text x="63" y="142" font-size="11" font-weight="700" fill="#3a638f">MOMENT 1 — RECIPIENT LOOKUP</text>
  <text x="63" y="162" font-size="11.5" fill="#3d3d3d">User types a UPI ID or scans a QR code,</text>
  <text x="63" y="178" font-size="11.5" fill="#3d3d3d">before any amount is entered</text>

  <g filter="url(#sh)">
    <rect x="410" y="118" width="330" height="72" rx="10" fill="#eef2fb" stroke="#c3cfe6" stroke-width="1.5"/>
  </g>
  <text x="425" y="142" font-size="11" font-weight="700" fill="#3a638f">MOMENT 2 — PRE-PIN PAYMENT</text>
  <text x="425" y="162" font-size="11.5" fill="#3d3d3d">User enters an amount and taps Pay,</text>
  <text x="425" y="178" font-size="11.5" fill="#3d3d3d">before the PIN screen — amount now known</text>

  <text x="1000" y="130" font-size="11" fill="#5b6472" text-anchor="middle">Both moments feed the same</text>
  <text x="1000" y="146" font-size="11" fill="#5b6472" text-anchor="middle">escalating pipeline below.</text>
  <text x="1000" y="162" font-size="11" fill="#5b6472" text-anchor="middle">Moment 2 unlocks amount-based checks.</text>

  <line x1="213" y1="190" x2="213" y2="216" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="575" y1="190" x2="575" y2="216" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- ===== Pipeline stages ===== -->
  <text x="48" y="238" font-size="12" font-weight="700" fill="#3d3d3d" letter-spacing="0.5">ESCALATING CHECKS — CHEAPEST FIRST, DEEPEST ONLY WHEN NEEDED</text>

  <!-- Stage 1 -->
  <g filter="url(#sh)">
    <rect x="48" y="252" width="270" height="150" rx="10" fill="#eafbf1" stroke="#a9dfc0" stroke-width="1.5"/>
  </g>
  <text x="183" y="276" font-size="11" font-weight="700" fill="#1e7a4a" text-anchor="middle">STAGE 1 · RUNS ON EVERY TRANSACTION</text>
  <text x="183" y="298" font-size="13.5" font-weight="600" fill="#12213f" text-anchor="middle">Instant Checks</text>
  <line x1="66" y1="308" x2="300" y2="308" stroke="#bfe6cf" stroke-width="1"/>
  <text x="66" y="326" font-size="10.5" fill="#2f5d4d">• Does the ID claim to be a bank,</text>
  <text x="78" y="340" font-size="10.5" fill="#2f5d4d">police, or government office?</text>
  <text x="66" y="358" font-size="10.5" fill="#2f5d4d">• Is the QR / link designed to</text>
  <text x="78" y="372" font-size="10.5" fill="#2f5d4d">trick someone into paying?</text>
  <text x="66" y="392" font-size="10" font-style="italic" fill="#5a8a6f">Fraction of a millisecond</text>

  <!-- Gate diamond -->
  <path d="M 340 327 L 388 292 L 436 327 L 388 362 Z" fill="#fffaf0" stroke="#e0c07a" stroke-width="1.5"/>
  <text x="388" y="320" font-size="9.5" font-weight="700" fill="#8a6a1a" text-anchor="middle">Flagged, or</text>
  <text x="388" y="333" font-size="9.5" font-weight="700" fill="#8a6a1a" text-anchor="middle">unfamiliar</text>
  <text x="388" y="346" font-size="9.5" font-weight="700" fill="#8a6a1a" text-anchor="middle">recipient?</text>

  <line x1="318" y1="327" x2="336" y2="327" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- No -> skip to score -->
  <path d="M 388 362 L 388 470 L 700 470" fill="none" stroke="#1e7a4a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a1)"/>
  <text x="420" y="462" font-size="10" fill="#1e7a4a" font-weight="600">NO — skip straight to scoring</text>

  <!-- Yes -> stage 2 -->
  <line x1="436" y1="327" x2="464" y2="327" stroke="#c0851f" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="450" y="317" font-size="10" fill="#a86a00" font-weight="600">YES</text>

  <!-- Stage 2 -->
  <g filter="url(#sh)">
    <rect x="464" y="252" width="330" height="150" rx="10" fill="#fff6e8" stroke="#f0d59a" stroke-width="1.5"/>
  </g>
  <text x="629" y="276" font-size="11" font-weight="700" fill="#a86a00" text-anchor="middle">STAGE 2 · ONLY IF FLAGGED OR UNFAMILIAR</text>
  <text x="629" y="298" font-size="13.5" font-weight="600" fill="#12213f" text-anchor="middle">Deep Investigation</text>
  <line x1="482" y1="308" x2="930" y2="308" stroke="#f0dfad" stroke-width="1"/>
  <text x="482" y="326" font-size="10.5" fill="#8a6a1a">• Network traffic: lookup vs. pay ratio,</text>
  <text x="494" y="340" font-size="10.5" fill="#8a6a1a">sudden lookup bursts across apps</text>
  <text x="482" y="358" font-size="10.5" fill="#8a6a1a">• Recipient account: age, drain speed,</text>
  <text x="494" y="372" font-size="10.5" fill="#8a6a1a">one-way flow, working-hours pattern</text>
  <text x="482" y="390" font-size="10.5" fill="#8a6a1a">• Sender history: outlier size, escalating</text>

  <line x1="794" y1="327" x2="822" y2="327" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Stage 3 -->
  <g filter="url(#sh)">
    <rect x="822" y="252" width="220" height="150" rx="10" fill="#f1f1f4" stroke="#d3d3da" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="932" y="276" font-size="11" font-weight="700" fill="#6b6b76" text-anchor="middle">STAGE 3 · ILLUSTRATIVE</text>
  <text x="932" y="298" font-size="13.5" font-weight="600" fill="#3d3d3d" text-anchor="middle">External Registries</text>
  <line x1="840" y1="308" x2="1024" y2="308" stroke="#dcdce2" stroke-width="1"/>
  <text x="840" y="326" font-size="10.5" fill="#6b6b76">• Police fraud-freeze lists</text>
  <text x="840" y="344" font-size="10.5" fill="#6b6b76">• National cybercrime helpline</text>
  <text x="840" y="362" font-size="10.5" fill="#6b6b76">• Telecom fraud / spam registry</text>
  <text x="840" y="388" font-size="9.5" font-style="italic" fill="#8a8a90">Pending formal government</text>
  <text x="840" y="400" font-size="9.5" font-style="italic" fill="#8a8a90">integration agreements</text>

  <!-- Stage 3 down to score -->
  <path d="M 932 402 L 932 440 L 700 440 L 700 470" fill="none" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a1)"/>

  <!-- ===== Score & Zones ===== -->
  <g filter="url(#sh)">
    <rect x="440" y="470" width="400" height="52" rx="9" fill="#eef2fb" stroke="#c3cfe6" stroke-width="1.5"/>
  </g>
  <text x="640" y="500" font-size="13" font-weight="700" fill="#12213f" text-anchor="middle">Risk Score = sum of every triggered signal (0 – 1)</text>

  <line x1="640" y1="522" x2="640" y2="546" stroke="#5b6472" stroke-width="1.6" marker-end="url(#a1)"/>

  <g filter="url(#sh)">
    <rect x="176" y="548" width="180" height="72" rx="9" fill="#eafbf1" stroke="#8fd6ac" stroke-width="1.5"/>
  </g>
  <text x="266" y="572" font-size="12.5" font-weight="700" fill="#1e7a4a" text-anchor="middle">ALLOW</text>
  <text x="266" y="590" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Score ≤ 0.30</text>
  <text x="266" y="605" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Proceeds immediately</text>

  <g filter="url(#sh)">
    <rect x="380" y="548" width="180" height="72" rx="9" fill="#fff6e8" stroke="#f0d59a" stroke-width="1.5"/>
  </g>
  <text x="470" y="572" font-size="12.5" font-weight="700" fill="#a86a00" text-anchor="middle">STEP-UP</text>
  <text x="470" y="590" font-size="9.5" fill="#4a5a5a" text-anchor="middle">0.31 – 0.65</text>
  <text x="470" y="605" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Must actively confirm</text>

  <g filter="url(#sh)">
    <rect x="584" y="548" width="180" height="72" rx="9" fill="#fdece7" stroke="#f0a98f" stroke-width="1.5"/>
  </g>
  <text x="674" y="572" font-size="12.5" font-weight="700" fill="#c0501f" text-anchor="middle">COACH</text>
  <text x="674" y="590" font-size="9.5" fill="#4a5a5a" text-anchor="middle">0.66 – 0.85</text>
  <text x="674" y="605" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Must acknowledge warning</text>

  <g filter="url(#sh)">
    <rect x="788" y="548" width="180" height="72" rx="9" fill="#fbeaea" stroke="#e6a5a1" stroke-width="1.5"/>
  </g>
  <text x="878" y="572" font-size="12.5" font-weight="700" fill="#b3261e" text-anchor="middle">FREEZE</text>
  <text x="878" y="590" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Score &gt; 0.85</text>
  <text x="878" y="605" font-size="9.5" fill="#4a5a5a" text-anchor="middle">Hard block · zero money moves</text>

  <path d="M 620 522 L 266 546" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a1)"/>
  <path d="M 630 522 L 470 546" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a1)"/>
  <path d="M 650 522 L 674 546" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a1)"/>
  <path d="M 660 522 L 878 546" fill="none" stroke="#5b6472" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- Safety net -->
  <g filter="url(#sh)">
    <rect x="1010" y="470" width="222" height="150" rx="9" fill="#eaf1fb" stroke="#b9d0ec" stroke-width="1.5"/>
  </g>
  <text x="1121" y="494" font-size="11" font-weight="700" fill="#3a638f" text-anchor="middle">SAFETY RULE</text>
  <text x="1121" y="516" font-size="11" fill="#3d3d3d" text-anchor="middle">If deep account data can't</text>
  <text x="1121" y="532" font-size="11" fill="#3d3d3d" text-anchor="middle">be retrieved in time for a</text>
  <text x="1121" y="548" font-size="11" fill="#3d3d3d" text-anchor="middle">stranger recipient, the zone</text>
  <text x="1121" y="564" font-size="11" fill="#3d3d3d" text-anchor="middle">is floored at Step-Up.</text>
  <text x="1121" y="588" font-size="10.5" font-weight="600" fill="#3a638f" text-anchor="middle">Missing data never</text>
  <text x="1121" y="604" font-size="10.5" font-weight="600" fill="#3a638f" text-anchor="middle">defaults to safe.</text>

  <path d="M 968 546 L 1008 528" fill="none" stroke="#3a638f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a2)"/>

  <!-- Footer note -->
  <rect x="0" y="700" width="1280" height="20" fill="#f7f7f9"/>
  <text x="640" y="714" font-size="10.5" fill="#8a8a90" text-anchor="middle">Once a zone is set, Coach and Freeze route to the Intervention Layer for warning, acknowledgment or a hard stop — the score itself is never revised afterward.</text>
</svg>
