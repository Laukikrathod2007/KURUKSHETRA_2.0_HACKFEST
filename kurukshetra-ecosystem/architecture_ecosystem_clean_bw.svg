<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="1140" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .outer-box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; rx: 6; ry: 6; }
    .inner-box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; rx: 4; ry: 4; }
    .container-box { fill: #fafafa; stroke: #444444; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 8; ry: 8; }
    .header-text { fill: #1a1a1a; font-weight: 700; font-size: 13px; text-anchor: middle; letter-spacing: 0.5px; }
    .box-text { fill: #1a1a1a; font-weight: 600; font-size: 12px; text-anchor: middle; }
    .sub-text { fill: #555555; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #1a1a1a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .badge { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; rx: 4; ry: 4; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a1a1a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="1140" class="bg" />

  <!-- 1. PSP PAYMENT APPS LAYER -->
  <g transform="translate(60, 40)">
    <rect width="980" height="90" class="outer-box" />
    <text x="490" y="24" class="header-text">PSP PAYMENT APPS</text>
    
    <g transform="translate(40, 36)">
      <rect width="260" height="40" class="inner-box" />
      <text x="130" y="25" class="box-text">Google Pay</text>
    </g>

    <g transform="translate(360, 36)">
      <rect width="260" height="40" class="inner-box" />
      <text x="130" y="25" class="box-text">PhonePe</text>
    </g>

    <g transform="translate(680, 36)">
      <rect width="260" height="40" class="inner-box" />
      <text x="130" y="25" class="box-text">Card / NetBanking</text>
    </g>
  </g>

  <!-- Arrow to Switch -->
  <path d="M 550, 130 L 550, 165" class="arrow" />

  <!-- 2. NPCI SWITCH & CENTRAL MAPPER -->
  <g transform="translate(60, 165)">
    <rect width="980" height="50" class="outer-box" />
    <text x="490" y="30" class="header-text">NPCI SWITCH &amp; CENTRAL MAPPER</text>
  </g>

  <!-- Arrow to Engine -->
  <path d="M 550, 215 L 550, 250" class="arrow" />

  <!-- 3. KURUKSHETRA FRAUD INTERCEPTION ENGINE -->
  <g transform="translate(60, 250)">
    <rect width="980" height="410" class="container-box" />
    <text x="490" y="24" class="header-text">KURUKSHETRA FRAUD INTERCEPTION ENGINE</text>

    <!-- Tier 0 -->
    <g transform="translate(40, 40)">
      <rect width="900" height="45" class="inner-box" />
      <text x="450" y="27" class="box-text">Tier 0: App-Local History Ledger (&lt; 10ms)</text>
    </g>

    <path d="M 490, 85 L 490, 110" class="arrow" />

    <!-- Tier 1 -->
    <g transform="translate(40, 110)">
      <rect width="900" height="115" class="inner-box" />
      <text x="450" y="24" class="header-text">Tier 1: Multi-Source Detectors (&lt; 45ms)</text>
      
      <!-- 3 Explicit Inner Boxes -->
      <g transform="translate(30, 42)">
        <rect width="250" height="50" class="badge" />
        <text x="125" y="30" class="box-text">CBS Detector</text>
      </g>

      <g transform="translate(325, 42)">
        <rect width="250" height="50" class="badge" />
        <text x="125" y="30" class="box-text">Ledger Detector</text>
      </g>

      <g transform="translate(620, 42)">
        <rect width="250" height="50" class="badge" />
        <text x="125" y="30" class="box-text">Switch &amp; Reputation</text>
      </g>
    </g>

    <path d="M 490, 225 L 490, 250" class="arrow" />

    <!-- Tier 2 -->
    <g transform="translate(40, 250)">
      <rect width="900" height="45" class="inner-box" />
      <text x="450" y="27" class="box-text">Tier 2: Staged Government Registries (I4C / TRAI / Aadhaar)</text>
    </g>

    <path d="M 490, 295 L 490, 320" class="arrow" />

    <!-- Scoring Engine -->
    <g transform="translate(40, 320)">
      <rect width="900" height="55" class="outer-box" />
      <text x="450" y="24" class="header-text">DETERMINISTIC RISK SCORING ENGINE</text>
      <text x="450" y="42" class="sub-text">ALLOW   |   STEP_UP   |   COACH   |   FREEZE</text>
    </g>
  </g>

  <!-- Branching Arrows from Engine -->
  <path d="M 300, 660 L 300, 700" class="arrow" />
  <path d="M 800, 660 L 800, 700" class="arrow" />

  <!-- 4. FastMCP INTERVENTION HOST & 5. CORE BANKING SYSTEMS -->
  <g transform="translate(60, 700)">
    <rect width="460" height="60" class="outer-box" />
    <text x="230" y="35" class="header-text">FastMCP INTERVENTION HOST</text>
  </g>

  <g transform="translate(580, 700)">
    <rect width="460" height="60" class="outer-box" />
    <text x="230" y="35" class="header-text">CORE BANKING SYSTEMS (CBS)</text>
  </g>

  <!-- Arrows to Audit & Telemetry -->
  <path d="M 290, 760 L 550, 800" class="arrow" />
  <path d="M 810, 760 L 550, 800" class="arrow" />

  <!-- 6. AUDIT & TELEMETRY OBSERVABILITY ENGINE -->
  <g transform="translate(60, 800)">
    <rect width="980" height="65" class="outer-box" />
    <text x="490" y="38" class="header-text">AUDIT &amp; TELEMETRY OBSERVABILITY ENGINE (SOC Observer)</text>
  </g>

</svg>
